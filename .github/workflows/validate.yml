name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  readme-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: README art matches its generators
        run: node .github/scripts/readme-art/render.mjs --check

  cli-and-sdk-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install @zapier/zapier-sdk and @zapier/zapier-sdk-cli
        run: npm install --no-audit --no-fund --no-save @zapier/zapier-sdk-cli @zapier/zapier-sdk

      - name: CLI help
        run: npx --no-install zapier-sdk --help

      - name: SDK loads
        run: node -e "import('@zapier/zapier-sdk').then(m => { const keys = Object.keys(m); console.log('SDK exports', keys.length, 'symbols; first few:', keys.slice(0, 8).join(', ')); })"
